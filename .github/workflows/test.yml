name: Test against Manuskript Plugin API 1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Check out the stable Plugin API 1 host
        uses: actions/checkout@v4
        with:
          repository: MustardBell/manuskript
          ref: 86249e7c5bf8b4a94f34e12870259d0be0eea6dc
          path: host

      - name: Check out this plugin into the host
        uses: actions/checkout@v4
        with:
          path: host/manuskript/plugins/variant_workspaces

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest pytest-faulthandler

      - name: Install exact Linux host requirements
        if: runner.os == 'Linux'
        run: pip install -r host/requirements.txt

      - name: Install portable host requirements
        if: runner.os != 'Linux'
        shell: bash
        run: |
          grep -vE '^(PyQt5-Qt5|PyQt5_sip)==' host/requirements.txt > portable-requirements.txt
          pip install -r portable-requirements.txt

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install \
            build-essential qtbase5-dev qt5-qmake \
            libxml2-dev libxslt1-dev mesa-utils libgl1 libgl1-mesa-dev \
            libxcb-xinerama0-dev libenchant-2-2 xvfb xauth

      - name: Test plugin and public-API boundary on Linux
        if: runner.os == 'Linux'
        working-directory: host
        run: >-
          xvfb-run -a -s '-screen 0 640x480x24 +extension GLX'
          python -B -m pytest -q
          manuskript/plugins/variant_workspaces/tests
          manuskript/tests/plugins/test_api_boundary.py

      - name: Test plugin and public-API boundary on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: host
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -B -m pytest -q
          manuskript/plugins/variant_workspaces/tests
          manuskript/tests/plugins/test_api_boundary.py
